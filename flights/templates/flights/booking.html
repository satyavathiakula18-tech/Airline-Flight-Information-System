
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Flight</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #243b55;
        }

        .booking-box {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #17365d;
        }

        .flight-info {
            background: #eaf3fc;
            padding: 15px;
            border-radius: 9px;
            margin: 20px 0;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #104d80;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1769aa;
            text-decoration: none;
        }

        .messages {
            color: #c0392b;
        }
    </style>
</head>

<body>

<div class="booking-box">

    <h2>✈ Book Your Flight</h2>

    <div class="flight-info">
        <h3>{{ flight.flight_number }}</h3>

        <p>
            {{ flight.source.city }}
            → {{ flight.destination.city }}
        </p>

        <p>
            Available Seats: {{ flight.available_seats }}
        </p>
    </div>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Select Travel Class</label>

        <select name="travel_class" required>
            {% for ticket in flight.prices.all %}
                <option value="{{ ticket.travel_class }}">
                    {{ ticket.travel_class }} - ₹{{ ticket.price }}
                </option>
            {% endfor %}
        </select>

        <label>Number of Passengers</label>

        <input
            type="number"
            name="passengers"
            min="1"
            max="{{ flight.available_seats }}"
            value="1"
            required
        >

        <button type="submit">
            Confirm Booking
        </button>

    </form>

    <a href="{% url 'flight_details' flight.id %}" class="back-link">
        ← Back to Flight Details
    </a>

</div>

</body>
</html>
