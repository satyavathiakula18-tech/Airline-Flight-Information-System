
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Travel Budget</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            color: #172554;
        }

        header {
            background: #102a43;
            color: white;
            padding: 25px 8%;
        }

        .container {
            max-width: 700px;
            margin: 35px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 15px 0 7px;
        }

        .form-control {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #087e8b;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #1769aa;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>✏️ Edit Travel Budget</h1>
    <p>Update your trip and expense details.</p>
</header>

<div class="container">

    <h2>{{ budget.trip_name }}</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.non_field_errors }}

        {% for field in form %}

            <label for="{{ field.id_for_label }}">
                {{ field.label }}
            </label>

            {{ field }}

            {{ field.errors }}

        {% endfor %}

        <button type="submit">
            Update Travel Budget
        </button>

    </form>

    <a href="{% url 'travel_budget_planner' %}" class="back">
        ← Back to Travel Budget
    </a>

</div>

</body>
</html>
